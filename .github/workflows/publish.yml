name: Python Publish
run-name: Publish ${{ inputs.project }}
on:
  workflow_dispatch:
    inputs:
      project:
        description: Project to publish
        required: true
        type: choice
        options:
          - aiomcp-server-filesystem
          - aiomcp-server-time
permissions:
  contents: read
jobs:
  release-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Build release distributions
        working-directory: projects/${{ inputs.project }}
        run: |
          python -m pip install build
          python -m build
      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: release-dists
          path: projects/${{ inputs.project }}/dist/
          retention-days: 1
  pypi-publish:
    runs-on: ubuntu-latest
    needs:
      - release-build
    permissions:
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/project/${{ inputs.project }}/
    steps:
      - name: Retrieve release distributions
        uses: actions/download-artifact@v4
        with:
          name: release-dists
          path: dist/
      - name: Publish release distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
          packages-dir: dist/
